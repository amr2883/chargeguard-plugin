name: Build and Release Plugin ZIP
permissions:
  contents: write

# يُشغَّل تلقائياً عند دفع أي تاج يبدأ بـ v (مثال: v1.0.14)، أو يدوياً من تبويب Actions
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    # الأهم: ubuntu-latest وليس windows-latest — هذا هو الإصلاح الجذري.
    # كل عمليات الضغط تتم هنا بأداة zip الأصلية على Linux، التي تستخدم
    # الفاصل / حصرياً في كل مدخل داخل الأرشيف، مطابقةً تماماً لبيئة
    # التشغيل الفعلية (خوادم ووردبريس تعمل على Linux).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install production dependencies only
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Determine plugin version from main file
        id: plugin_version
        run: |
          VERSION=$(grep -m1 "Version:" chargeguard-woocommerce.php | sed -E 's/.*Version:[[:space:]]*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected plugin version: $VERSION"

      - name: Build clean plugin folder (staging)
        run: |
          mkdir -p build/chargeguard
          # انسخ فقط ما يحتاجه التاجر فعلياً في الإنتاج.
          # عدّل هذه القائمة لتطابق بنية مستودعك بالضبط.
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='phpunit.xml' \
            --exclude='composer.lock' \
            --exclude='.gitignore' \
            --exclude='.distignore' \
            --exclude='node_modules' \
            --exclude='build' \
            ./ build/chargeguard/
      - name: Strip BOM from all PHP files (safety net)
        working-directory: build/chargeguard
        run: |
          BOM_FOUND=0
          while IFS= read -r -d '' f; do
            if [ "$(head -c3 "$f" | od -An -tx1 | tr -d ' ')" = "efbbbf" ]; then
              echo "BOM found and stripped: $f"
              tail -c +4 "$f" > "${f}.tmp" && mv "${f}.tmp" "$f"
              BOM_FOUND=1
            fi
          done < <(find . -name "*.php" -print0)
          if [ "$BOM_FOUND" -eq 1 ]; then
            echo "::warning::One or more PHP files had a BOM that was auto-stripped before packaging."
          else
            echo "No BOM found in any PHP file."
          fi

      - name: Create ZIP using native Linux zip (forward-slash paths guaranteed)
        working-directory: build
        run: |
          zip -r chargeguard.zip chargeguard -x '*.DS_Store'

      - name: Verify no backslash-named entries exist in the ZIP
        # هذه الخطوة تفشل الـ build بالكامل ولا تسمح بنشر أي إصدار
        # يحتوي هذا الخلل مستقبلاً، بغض النظر عن كيفية بنائه.
        working-directory: build
        run: |
          BAD_ENTRIES=$(unzip -l chargeguard.zip | awk '{print $4}' | grep -F '\\' || true)
          if [ -n "$BAD_ENTRIES" ]; then
            echo "❌ ZIP يحتوي مدخلات بفاصل backslash خاطئ:"
            echo "$BAD_ENTRIES"
            exit 1
          fi
          echo "✅ لا توجد مدخلات بفاصل backslash — الأرشيف سليم."

      - name: Verify critical files exist inside the ZIP
        working-directory: build
        run: |
          REQUIRED_FILES=(
            "chargeguard/chargeguard-woocommerce.php"
            "chargeguard/includes/class-admin-settings.php"
            "chargeguard/includes/class-api-client.php"
            "chargeguard/includes/class-dynamic-firewall.php"
            "chargeguard/includes/class-stripe-webhook.php"
            "chargeguard/uninstall.php"
          )
          MISSING=0
          for f in "${REQUIRED_FILES[@]}"; do
            if ! unzip -l chargeguard.zip | grep -qF "$f"; then
              echo "❌ ملف مفقود من الأرشيف: $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "فشل التحقق — إصدار ناقص لن يُنشَر."
            exit 1
          fi
          echo "✅ كل الملفات الحرجة موجودة."

      - name: Smoke-test the ZIP on a real WordPress + WooCommerce container
        run: |
          docker run -d --name wp-smoke-test -p 8099:80 \
            -e WORDPRESS_DB_HOST=127.0.0.1 wordpress:latest || true
          # ملاحظة: هذه خطوة اختيارية للتوسع لاحقاً (تشغيل تثبيت وتفعيل
          # فعليين عبر wp-cli داخل الـ runner قبل النشر). يمكن تفعيلها
          # لاحقاً كطبقة حماية إضافية إن رغبتم في تشديد المراجعة أكثر.
        continue-on-error: true

      - name: Upload ZIP as workflow artifact (for manual inspection)
        uses: actions/upload-artifact@v4
        with:
          name: chargeguard-${{ steps.plugin_version.outputs.version }}
          path: build/chargeguard.zip

      - name: Create GitHub Release with the verified ZIP
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/chargeguard.zip
          generate_release_notes: true